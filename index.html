<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worter — картки для слів</title>

  <style>
    body {
  margin: 0;
  font-family: Arial, sans-serif;

  /* ФОН */
  background: url('images/background.png') no-repeat center center fixed;
  background-size: cover;          /* на всю сторінку */
  background-position: center;     /* по центру */
  background-repeat: no-repeat;
  background-attachment: fixed;    /* ⬅️ НЕ ПРОКРУЧУЄТЬСЯ */

  /* ЦЕНТРУВАННЯ КАРТКИ */
  display: flex;
  justify-content: center;
  align-items: center;

  min-height: 100vh;
  overflow: hidden;                /* ⬅️ нічого не прокручується */
}
  .wrapper {
  width: min(900px, 100%);
  padding: 0 16px;
  display: grid;
  grid-template-columns: 60px 1fr 60px;
  align-items: center;
  justify-items: center;
  position: relative;
  z-index: 1;
}

    .arrow {
      width: 60px;
      height: 60px;
      font-size: 48px;
      background: none;
      border: none;
      cursor: pointer;
      color: #111;
      display: grid;
      place-items: center;
      padding: 0;
      user-select: none;
    }

    .arrow:hover {
      color: #4f46e5;
      transform: scale(1.08);
    }

    .carousel {
      perspective: 1200px;
      justify-self: center; /* гарантує центр у середині */
    }

    .card {
      width: 420px;
      height: 260px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s;
      cursor: pointer;
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .card__side {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      border-radius: 18px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.2);
      padding: 20px;
      text-align: center;
    }

    .card__front {
      background: #ffffff;
      color: #111;
    }

    .card__back {
      background: #4f46e5;
      color: #ffffff;
      transform: rotateY(180deg);
    }

    .counter {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      color: #555;
    }

    /* Адаптація для телефону */
    @media (max-width: 520px) {
      .wrapper {
        grid-template-columns: 50px 1fr 50px;
      }

      .arrow {
        width: 50px;
        height: 50px;
        font-size: 40px;
      }

      .card {
        width: 320px;
        height: 210px;
      }

      .card__side {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="wrapper">
    <button class="arrow" type="button" aria-label="Назад" onclick="prevCard()">&#8249;</button>

    <div class="carousel">
      <div class="card" id="card">
        <div class="card__side card__front" id="front"></div>
        <div class="card__side card__back" id="back"></div>
      </div>
    </div>

    <button class="arrow" type="button" aria-label="Вперед" onclick="nextCard()">&#8250;</button>
  </div>

  <div class="counter" id="counter"></div>

  <script>
const words = [
  { front: "der Kurierdienst, -e", back: "курьерская служба" },
  { front: "die Auslieferung, -en", back: "доставка (развоз), выдача" },
  { front: "die Ware, -n", back: "товар" },
  { front: "die Beladung, -en", back: "погрузка" },
  { front: "ausladen", back: "разгружать" },
  { front: "voraussetzen", back: "предполагать, требовать (как условие)" },
  { front: "selbstständig", back: "самостоятельный; самозанятый" },
  { front: "zuverlässig", back: "надёжный" },
  { front: "die Arbeitsweise, -n", back: "способ работы, метод работы" },
  { front: "unbefristet", back: "бессрочный" },
  { front: "der Arbeitsvertrag, -e", back: "трудовой договор" },
  { front: "krisensicher", back: "устойчивый к кризисам, надёжный в кризис" },
  { front: "der Arbeitgeber, =", back: "работодатель" },
  { front: "die Schichteinteilung, -en", back: "распределение смен, график смен" },
  { front: "die Aushilfe, -n", back: "подработка; помощник/временный работник" },
  { front: "das Unternehmen, =", back: "предприятие, компания" },
  { front: "die Voraussetzung, -en", back: "условие, предпосылка, требование" },
  { front: "gängig", back: "распространённый, обычный" },
  { front: "das Geschick, -e (meist Sg.)", back: "ловкость, умение" },
  { front: "das Verhalten, = (meist Sg.)", back: "поведение" },
  { front: "der Nachwuchs (nur Sg.)", back: "потомство; молодёжь/кадровая смена" },
  { front: "mehrjährig", back: "многолетний" },
  { front: "fundiert", back: "основательный, обоснованный" },
  { front: "angemessen", back: "соответствующий, адекватный" },
  { front: "das Honorar, -e (meist Sg.)", back: "гонорар" },
  { front: "familienfreundlich", back: "дружелюбный к семье/семейный" },
  { front: "das Arbeitsverhältnis, -se", back: "трудовые отношения" },
  { front: "die Betreuung, -en", back: "уход; присмотр; сопровождение/кураторство" },
  { front: "die Leitung, -en", back: "руководство; руководство (как управление)" },
  { front: "präzise", back: "точный" },
  { front: "die Bereitschaft, -en (meist Sg.)", back: "готовность" },
  { front: "die Weiterbildung, -en", back: "повышение квалификации, дальнейшее обучение" },
  { front: "die Geschäftsleitung, -en", back: "руководство компании (дирекция)" },
  { front: "der Input, -s (meist Sg.)", back: "вклад; ввод/информация (input)" },
  { front: "anwenden", back: "применять" },
  { front: "wertvoll", back: "ценный" },
  { front: "der Eindruck, -e", back: "впечатление" },
  { front: "die Stressresistenz (nur Sg.)", back: "стрессоустойчивость" },

  { front: "festigen", back: "укреплять, закреплять" },
  { front: "der Zeitdruck (nur Sg.)", back: "нехватка времени, давление по времени" },
  { front: "mehrfach", back: "многократно; неоднократно" },
  { front: "sich auszahlen", back: "окупаться, приносить пользу" },
  { front: "die Tätigkeit, -en", back: "деятельность; занятие; работа" },
  { front: "die Werbeagentur, -en", back: "рекламное агентство" },
  { front: "die Stellenanzeige, -n", back: "объявление о вакансии" },
  { front: "die Buchhaltung, -en (meist Sg.)", back: "бухгалтерия, бухгалтерский учёт" },
  { front: "beteiligt", back: "вовлечённый; участвующий" },
  { front: "vorherig", back: "предыдущий" },
  { front: "vertraut sein mit", back: "быть знакомым с, разбираться в" },
  { front: "das Aufgabengebiet, -e", back: "круг задач, область обязанностей" },
  { front: "flüssig", back: "бегло (о языке); плавный" },
  { front: "bisherig", back: "до сих пор; прежний" },
  { front: "sich einer Herausforderung stellen", back: "принять вызов, справиться с трудностью" },
  { front: "lernbereit", back: "готовый учиться" },
  { front: "zur Verfügung stehen", back: "быть в распоряжении, быть доступным" },
  { front: "die Lücke, -n", back: "пробел, брешь" },
  { front: "zur Welt bringen", back: "родить (ребёнка)" },
  { front: "die Elternzeit (nur Sg.)", back: "родительский отпуск" },
  { front: "sich weiterentwickeln", back: "развиваться дальше" },
  { front: "erkrankt", back: "заболевший" },
  { front: "die Fachkenntnis, -se", back: "профессиональные знания" },
  { front: "der Tutor, -en", back: "тьютор, наставник" },
  { front: "der Ablauf, -e", back: "ход процесса, последовательность" },
  { front: "wöchentlich", back: "еженедельно" },
  { front: "der Abteilungsleiter, =", back: "руководитель отдела" },
  { front: "zukünftig", back: "будущий; в дальнейшем" },
  { front: "die Einarbeitungsphase, -n", back: "период ввода в работу, адаптация" },
  { front: "ausführlich", back: "подробный" },
  { front: "die Filialleitung, -en", back: "руководство филиала" },
  { front: "der Rat (nur Sg.)", back: "совет" },
  { front: "skeptisch", back: "скептический" },
  { front: "betreuen", back: "присматривать; сопровождать; курировать" },
  { front: "zufällig", back: "случайный; случайно" },
  { front: "kündigen", back: "увольнять(ся); расторгать договор" },
  { front: "das Richtige für jemanden sein", back: "быть подходящим/правильным для кого-то" }
];

    let index = 0;

    const card = document.getElementById('card');
    const front = document.getElementById('front');
    const back = document.getElementById('back');
    const counter = document.getElementById('counter');

    function renderCard() {
      card.classList.remove('is-flipped');
      front.textContent = words[index].front;
      back.textContent = words[index].back;
      counter.textContent = `${index + 1} / ${words.length}`;
    }

    card.addEventListener('click', () => {
      card.classList.toggle('is-flipped');
    });

    function nextCard() {
      index = (index + 1) % words.length;
      renderCard();
    }

    function prevCard() {
      index = (index - 1 + words.length) % words.length;
      renderCard();
    }

    // Листання клавішами
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextCard();
      if (e.key === 'ArrowLeft') prevCard();
    });

    renderCard();
  </script>

</body>
</html>

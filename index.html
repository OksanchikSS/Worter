<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worter — картки для слів</title>

  <style>
    /* ====== BASE ====== */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* ====== LAYOUT ====== */
    .wrapper {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    /* ====== ARROWS ====== */
  .arrow {
  width: 60px;         
  font-size: 48px;
  background: none;
  border: none;
  cursor: pointer;
  color: #111;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

    .arrow:hover {
      color: #4f46e5;
    }

    /* ====== CARD ====== */
    .carousel {
      perspective: 1200px;
    }

    .card {
      width: 380px;
      height: 240px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s;
      cursor: pointer;
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .card__side {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      border-radius: 18px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.2);
      padding: 20px;
      text-align: center;
    }

    .card__front {
      background: #ffffff;
    }

    .card__back {
      background: #4f46e5;
      color: #ffffff;
      transform: rotateY(180deg);
    }

    /* ====== COUNTER ====== */
    .counter {
      position: fixed;
      bottom: 24px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <button class="arrow" onclick="prevCard()">&#8249;</button>

    <div class="carousel">
      <div class="card" id="card">
        <div class="card__side card__front" id="front"></div>
        <div class="card__side card__back" id="back"></div>
      </div>
    </div>

    <button class="arrow" onclick="nextCard()">&#8250;</button>
  </div>

  <div class="counter" id="counter"></div>

  <script>
    const words = [
      { front: 'gehen', back: 'йти' },
      { front: 'kommen', back: 'приходити' },
      { front: 'lernen', back: 'вчити, навчатися' },
      { front: 'sprechen', back: 'говорити' },
      { front: 'sehen', back: 'бачити' }
    ];

    let index = 0;

    const card = document.getElementById('card');
    const front = document.getElementById('front');
    const back = document.getElementById('back');
    const counter = document.getElementById('counter');

    function renderCard() {
      card.classList.remove('is-flipped');
      front.textContent = words[index].front;
      back.textContent = words[index].back;
      counter.textContent = `${index + 1} / ${words.length}`;
    }

    card.addEventListener('click', () => {
      card.classList.toggle('is-flipped');
    });

    function nextCard() {
      index = (index + 1) % words.length;
      renderCard();
    }

    function prevCard() {
      index = (index - 1 + words.length) % words.length;
      renderCard();
    }

    renderCard();
  </script>

</body>
</html>

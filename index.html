<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Карусель слів</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .carousel {
      position: relative;
      width: 260px;
      perspective: 1000px;
    }

    .card {
      width: 100%;
      height: 160px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s;
      cursor: pointer;
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .card__side {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    .card__front {
      background: #ffffff;
    }

    .card__back {
      background: #4f46e5;
      color: #fff;
      transform: rotateY(180deg);
    }

    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div>
    <div class="carousel">
      <div class="card" id="card">
        <div class="card__side card__front" id="front"></div>
        <div class="card__side card__back" id="back"></div>
      </div>
    </div>

    <div class="controls">
      <button onclick="prevCard()">◀ Назад</button>
      <button onclick="nextCard()">Вперед ▶</button>
    </div>
  </div>

<script>
  const words = [
    { front: 'gehen', back: 'йти' },
    { front: 'kommen', back: 'приходити' },
    { front: 'lernen', back: 'вчити' },
    { front: 'sprechen', back: 'говорити' }
  ];

  let index = 0;
  const card = document.getElementById('card');
  const front = document.getElementById('front');
  const back = document.getElementById('back');

  function renderCard() {
    card.classList.remove('is-flipped');
    front.textContent = words[index].front;
    back.textContent = words[index].back;
  }

  card.addEventListener('click', () => {
    card.classList.toggle('is-flipped');
  });

  function nextCard() {
    index = (index + 1) % words.length;
    renderCard();
  }

  function prevCard() {
    index = (index - 1 + words.length) % words.length;
    renderCard();
  }

  renderCard();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worter — картки для слів</title>

  <style>
  body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: url('images/background.png') no-repeat center center fixed;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
}

.wrapper {
  width: min(90vw, 900px);          /* обмежуємо ширину, але не більше 90% екрана */
  padding: 0 12px;
  display: grid;
  grid-template-columns: 50px 1fr 50px;
  align-items: center;
  justify-items: center;
  position: relative;
  z-index: 1;
}

.arrow {
  width: 50px;
  height: 50px;
  font-size: 40px;
  background: none;
  border: none;
  cursor: pointer;
  color: #111;
  display: grid;
  place-items: center;
  padding: 0;
  user-select: none;
  touch-action: manipulation;       /* краще для тач-пристроїв */
}

.arrow:hover {
  color: #4f46e5;
  transform: scale(1.1);
}

.carousel {
  perspective: 1200px;
  justify-self: center;
}

.card {
  width: min(420px, 85vw);          /* головна магія: не ширше 85% екрана */
  aspect-ratio: 420 / 260;          /* зберігаємо пропорції */
  max-width: 100%;
  height: auto;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.6s;
  cursor: pointer;
}

.card.is-flipped {
  transform: rotateY(180deg);
}

.card__side {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(24px, 6vw, 34px); /* адаптивний розмір шрифту */
  border-radius: 18px;
  box-shadow: 0 16px 32px rgba(0, 0, 0, 0.2);
  padding: clamp(16px, 4vw, 20px);
  text-align: center;
}

.card__front {
  background: #ffffff;
  color: #111;
}

.card__back {
  background: #4f46e5;
  color: #ffffff;
  transform: rotateY(180deg);
}
    
.card__back.card__back--extra {
  background: coral !important;
  color: #fff;
}

.counter {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  color: #555;
}

/* Адаптація для телефонів */
@media (max-width: 520px) {
  .wrapper {
    grid-template-columns: 44px 1fr 44px;
    padding: 0 8px;
  }

  .arrow {
    width: 44px;
    height: 44px;
    font-size: 36px;
  }

  .card {
    width: min(320px, 85vw);
  }

  .card__side {
    font-size: clamp(22px, 5.5vw, 28px);
    padding: 16px;
  }
}

@media (max-width: 360px) {
  .wrapper {
    grid-template-columns: 40px 1fr 40px;
  }

  .arrow {
    width: 40px;
    height: 40px;
    font-size: 32px;
  }

  .card__side {
    font-size: clamp(20px, 5vw, 24px);
    padding: 12px;
  }
}
  </style>

  // Разворачиваем: после каждого пункта добавляем его extras как отдельные карточки (extra:true)
  const words = [];
  for (const item of baseWords) {
    words.push({ front: item.front, back: item.back }); // основная карточка
    if (Array.isArray(item.extras)) {
      for (const ex of item.extras) {
        words.push({ front: ex.front, back: ex.back, extra: true }); // дополнительная (коралловая)
      }
    }
  }

  let index = 0;

  const card = document.getElementById('card');
  const front = document.getElementById('front');
  const back = document.getElementById('back');
  const counter = document.getElementById('counter');

  function renderCard() {
    card.classList.remove('is-flipped');

    const item = words[index];
    front.textContent = item.front;
    back.textContent = item.back;

    // Включаем коралловый фон для extra
    back.classList.toggle('card__back--extra', item.extra === true);

    counter.textContent = `${index + 1} / ${words.length}`;
  }

  card.addEventListener('click', () => {
    card.classList.toggle('is-flipped');
  });

  function nextCard() {
    index = (index + 1) % words.length;
    renderCard();
  }

  function prevCard() {
    index = (index - 1 + words.length) % words.length;
    renderCard();
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextCard();
    if (e.key === 'ArrowLeft') prevCard();
  });

  renderCard();
